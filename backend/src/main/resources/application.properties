# ─── Server ────────────────────────────────────────────
server.port=8080

# ─── CORS (allow the frontend origin) ──────────────────
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500

# ─── MySQL ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/pinggram?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ───────────────────────────────────────────────
# Replace with a 256-bit (32-byte) Base64-encoded random secret in production
app.jwt.secret=cGluZ2dyYW0tc3VwZXItc2VjcmV0LWtleS0yMDI2LXByb2Q=
app.jwt.expiration-ms=86400000

# ─── Spring Retry ──────────────────────────────────────
spring.retry.enabled=true

# ─── Logging ───────────────────────────────────────────
logging.level.com.pinggram=INFO
logging.level.org.springframework.web.socket=WARN
